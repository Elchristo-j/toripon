<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贈答用ぶどう注文 | {{ store.name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0e8f5; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
    .frame { background: #f7f0fa; max-width: 480px; margin: 0 auto; min-height: 100vh; }

    .header { position: relative; height: 120px; background: #4a1a6e; display: flex; align-items: flex-end; padding: 0 1.25rem 1rem; overflow: hidden; }
    .header-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.45; }
    .header-title { position: relative; color: #e8c8f5; font-size: 18px; font-weight: 600; letter-spacing: 0.05em; }
    .header-sub { position: relative; color: #d4aee8; font-size: 11px; margin-top: 2px; }

    .body { padding: 1.25rem; }

    .section-title { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: #6b3a8a; letter-spacing: 0.08em; margin-bottom: 0.75rem; }
    .section-title::after { content: ''; flex: 1; height: 0.5px; background: #d4aee8; }

    .notice { background: #f0ddf7; border-radius: 6px; padding: 7px 10px; font-size: 11px; color: #6b3a8a; margin-bottom: 1rem; border-left: 3px solid #4a1a6e; }

    .field { width: 100%; padding: 10px 12px; border: 0.5px solid #c9a8d8; border-radius: 8px; font-size: 16px; background: #fff; margin-bottom: 8px; color: #2d1040; -webkit-appearance: none; }
    .field:focus { outline: none; border-color: #4a1a6e; }
    .field::placeholder { color: #b88fd0; }
    .field-row { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
    .section-box { background: #fff; border: 0.5px solid #c9a8d8; border-radius: 10px; padding: 12px; margin-bottom: 1.25rem; }

    /* 届け先ブロック */
    .address-block { background: #fff; border: 0.5px solid #c9a8d8; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .address-block-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .address-block-title { font-size: 13px; font-weight: 600; color: #4a1a6e; }
    .btn-remove-address { background: none; border: none; color: #a83030; font-size: 12px; cursor: pointer; padding: 2px 6px; }

    /* 品種選択（チェックボックス式） */
    .grape-check-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
    .grape-check-item { display: flex; align-items: center; gap: 8px; background: #f7f0fa; border: 0.5px solid #c9a8d8; border-radius: 8px; padding: 8px 10px; cursor: pointer; transition: background 0.15s; }
    .grape-check-item.checked { background: #ede0fa; border-color: #9a6ab0; }
    .grape-check-item input[type="checkbox"] { display: none; }
    .grape-check-dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c9a8d8; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .grape-check-item.checked .grape-check-dot { background: #4a1a6e; border-color: #4a1a6e; }
    .grape-check-dot::after { content: '✓'; color: #fff; font-size: 10px; display: none; }
    .grape-check-item.checked .grape-check-dot::after { display: block; }
    .grape-check-name { font-size: 12px; color: #2d1040; font-weight: 500; line-height: 1.3; }

    /* 比率メモ（2種以上で表示） */
    .ratio-notice { background: #fef9e8; border: 0.5px solid #e8d888; border-radius: 6px; padding: 7px 10px; font-size: 11px; color: #6b5010; margin-bottom: 8px; display: none; }

    /* 箱サイズ */
    .box-size-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .box-chip { flex: 1; padding: 10px 4px; border-radius: 8px; border: 0.5px solid #c9a8d8; background: #fff; text-align: center; cursor: pointer; }
    .box-chip.selected { background: #4a1a6e; border-color: #4a1a6e; }
    .box-chip .box-kg { font-size: 15px; font-weight: 600; color: #2d1040; }
    .box-chip.selected .box-kg { color: #fff; }
    .box-chip .box-label { font-size: 9px; color: #9a6ab0; margin-top: 1px; }
    .box-chip.selected .box-label { color: #d4aee8; }

    /* 箱数 */
    .count-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .count-label { font-size: 12px; color: #6b3a8a; white-space: nowrap; }
    .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: 0.5px solid #c9a8d8; background: #f0ddf7; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #4a1a6e; cursor: pointer; user-select: none; flex-shrink: 0; }
    .qty-num { font-size: 16px; font-weight: 600; color: #2d1040; min-width: 24px; text-align: center; }

    .btn-add-address { width: 100%; padding: 11px; border-radius: 8px; border: 1px dashed #c9a8d8; background: #f7f0fa; color: #6b3a8a; font-size: 13px; cursor: pointer; margin-bottom: 1.25rem; }

    /* 支払 */
    .pay-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 1.25rem; }
    .pay-chip { padding: 9px; border-radius: 8px; border: 0.5px solid #c9a8d8; background: #fff; text-align: center; font-size: 12px; color: #6b3a8a; cursor: pointer; }
    .pay-chip.selected { background: #4a1a6e; border-color: #4a1a6e; color: #e8c8f5; }

    .submit-btn { width: 100%; background: #4a1a6e; color: #e8c8f5; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 500; cursor: pointer; -webkit-appearance: none; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg { background: #fdf0f0; border: 0.5px solid #e8b0b0; border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #a83030; margin-bottom: 1rem; display: none; }

    .complete { display: none; text-align: center; padding: 2.5rem 1rem; }
    .complete-icon { font-size: 48px; margin-bottom: 1rem; }
    .complete-title { font-size: 18px; font-weight: 600; color: #4a1a6e; margin-bottom: 0.75rem; }
    .complete-text { font-size: 13px; color: #6b3a8a; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <div class="header-bg" style="background-image: url('https://res.cloudinary.com/dgxnatvsw/image/upload/v1779144796/%E8%97%A4%E7%A8%94%E3%82%8A_800_x_600_px_f6k4hn.jpg');"></div>
      <div>
        <div class="header-title">🍇 贈答用ぶどう注文</div>
        <div class="header-sub">{{ store.name }}</div>
      </div>
    </div>

    <div class="body" id="order-form">
      <div class="notice">
        ご注文後、オーナーが在庫を確認してからご連絡いたします。<br>
        確認後に決済方法をご案内します。
      </div>

      <!-- 申込者情報 -->
      <div class="section-title">申込者情報</div>
      <div class="section-box">
        <input class="field" id="customer_name" type="text" placeholder="お名前（必須）" autocomplete="name" />
        <input class="field" id="customer_phone" type="tel" placeholder="電話番号（必須）" autocomplete="tel" />
        <input class="field" id="customer_email" type="email" placeholder="メールアドレス（必須）" autocomplete="email" />
      </div>

      <!-- 送り主情報 -->
      <div class="section-title">送り主情報</div>
      <div class="section-box">
        <input class="field" id="sender_name" type="text" placeholder="氏名（必須）" />
        <input class="field" id="sender_phone" type="tel" placeholder="電話番号（必須）" />
        <div class="field-row">
          <input class="field" id="sender_postal_code" type="text" placeholder="〒（必須）" maxlength="8" />
          <input class="field" id="sender_address" type="text" placeholder="住所（必須）" />
        </div>
      </div>

      <!-- 届け先（複数対応） -->
      <div class="section-title">届け先・品種・箱サイズ</div>
      <div id="address-list"></div>
      <button class="btn-add-address" type="button" onclick="addAddress()">＋ 届け先を追加する</button>

      <!-- 支払方法 -->
      <div class="section-title">お支払方法</div>
      <div class="pay-grid">
        <div class="pay-chip selected" data-pay="bank">🏦 銀行振込</div>
        <div class="pay-chip" data-pay="paypay">📱 PayPay</div>
        <div class="pay-chip" data-pay="stripe">💳 クレジット</div>
        <div class="pay-chip" data-pay="cash">💴 現金（来店）</div>
      </div>

      <!-- 全体備考 -->
      <div class="section-title">備考・その他ご要望</div>
      <textarea class="field" id="note" rows="3" placeholder="のし・ギフト包装・比率のご指定など" style="margin-bottom:1.25rem;resize:none;"></textarea>

      <div class="error-msg" id="error-msg"></div>
      <button class="submit-btn" id="submit-btn" onclick="submitOrder()">📦 注文を申し込む</button>
    </div>

    <!-- 完了画面 -->
    <div class="complete" id="complete-screen">
      <div class="complete-icon">🍇</div>
      <div class="complete-title">申し込みを受け付けました</div>
      <p class="complete-text">オーナーが在庫を確認後、<br>メールにてお支払方法をご連絡いたします。<br><br>しばらくお待ちください。</p>
      <button class="submit-btn" style="margin-top:1.5rem;" onclick="location.reload()">🍇 最初に戻る</button>
    </div>
  </div>

  <script>
    const storeSlug = "{{ store.slug }}";
    const menuItems = [
      {% for item in menu_items %}
      { id: {{ item.id }}, name: "{{ item.name }}" },
      {% endfor %}
    ];
    let paymentMethod = 'bank';
    let addressCount = 0;
    // 届け先ごとの状態管理
    const addressState = {};

    function addAddress() {
      addressCount++;
      const n = addressCount;
      addressState[n] = { selectedItems: new Set(), boxSize: 2, boxCount: 1 };

      const container = document.getElementById('address-list');
      const block = document.createElement('div');
      block.className = 'address-block';
      block.id = 'address-block-' + n;

      // 品種チェックボックスHTML生成
      const grapeCheckHtml = menuItems.map(item => `
        <div class="grape-check-item" id="grape-check-${n}-${item.id}" onclick="toggleGrape(${n}, ${item.id})">
          <div class="grape-check-dot"></div>
          <div class="grape-check-name">${item.name}</div>
        </div>
      `).join('');

      block.innerHTML = `
        <div class="address-block-header">
          <div class="address-block-title">届け先 ${n}</div>
          ${n > 1 ? `<button class="btn-remove-address" type="button" onclick="removeAddress(${n})">✕ 削除</button>` : ''}
        </div>

        <input class="field" id="receiver_name_${n}" type="text" placeholder="氏名（必須）" />
        <input class="field" id="receiver_phone_${n}" type="tel" placeholder="電話番号" />
        <div class="field-row" style="margin-bottom:8px;">
          <input class="field" style="margin-bottom:0;" id="postal_code_${n}" type="text" placeholder="〒" maxlength="8" />
          <input class="field" style="margin-bottom:0;" id="address_${n}" type="text" placeholder="住所（必須）" />
        </div>

        <div style="font-size:11px;color:#6b3a8a;font-weight:600;letter-spacing:0.06em;margin:10px 0 6px;">品種を選ぶ（複数可）</div>
        <div class="grape-check-grid">${grapeCheckHtml}</div>

        <div class="ratio-notice" id="ratio-notice-${n}">
          💡 2種以上お選びの場合、比率のご希望は下の備考欄にご記入ください（例：シャインマスカット多め、など）
        </div>

        <div style="font-size:11px;color:#6b3a8a;font-weight:600;letter-spacing:0.06em;margin:10px 0 6px;">箱サイズ</div>
        <div class="box-size-row" id="box-size-row-${n}">
          <div class="box-chip" id="box-1-${n}" onclick="selectBox(${n}, 1)">
            <div class="box-kg">1kg</div><div class="box-label">小箱</div>
          </div>
          <div class="box-chip selected" id="box-2-${n}" onclick="selectBox(${n}, 2)">
            <div class="box-kg">2kg</div><div class="box-label">中箱</div>
          </div>
          <div class="box-chip" id="box-5-${n}" onclick="selectBox(${n}, 5)">
            <div class="box-kg">5kg</div><div class="box-label">大箱</div>
          </div>
        </div>

        <div class="count-row">
          <div class="count-label">箱数：</div>
          <div class="qty-btn" onclick="changeCount(${n}, -1)">−</div>
          <div class="qty-num" id="count-num-${n}">1</div>
          <div class="qty-btn" onclick="changeCount(${n}, 1)">＋</div>
          <div style="font-size:12px;color:#9a6ab0;">箱</div>
        </div>

        <div style="font-size:11px;color:#6b3a8a;font-weight:600;letter-spacing:0.06em;margin:4px 0 6px;">希望配送日</div>
        <input class="field" id="delivery_date_${n}" type="date" style="margin-bottom:8px;" />

        <input class="field" id="addr_note_${n}" type="text" placeholder="のし・比率のご希望など（任意）" />
      `;
      container.appendChild(block);

      // 配送日の最小値（翌日以降）
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('delivery_date_' + n).min = tomorrow.toISOString().split('T')[0];

      renumberAddresses();
    }

    function removeAddress(n) {
      const block = document.getElementById('address-block-' + n);
      if (block) block.remove();
      delete addressState[n];
      renumberAddresses();
    }

    function renumberAddresses() {
      const blocks = document.querySelectorAll('.address-block');
      blocks.forEach((block, i) => {
        const title = block.querySelector('.address-block-title');
        if (title) title.textContent = `届け先 ${i + 1}`;
      });
    }

    function toggleGrape(n, itemId) {
      const state = addressState[n];
      const el = document.getElementById(`grape-check-${n}-${itemId}`);
      if (state.selectedItems.has(itemId)) {
        state.selectedItems.delete(itemId);
        el.classList.remove('checked');
      } else {
        state.selectedItems.add(itemId);
        el.classList.add('checked');
      }
      // 2種以上でヒント表示
      const notice = document.getElementById(`ratio-notice-${n}`);
      notice.style.display = state.selectedItems.size >= 2 ? 'block' : 'none';
    }

    function selectBox(n, size) {
      addressState[n].boxSize = size;
      [1, 2, 5].forEach(s => {
        const el = document.getElementById(`box-${s}-${n}`);
        if (el) el.classList.toggle('selected', s === size);
      });
    }

    function changeCount(n, delta) {
      const state = addressState[n];
      state.boxCount = Math.max(1, state.boxCount + delta);
      document.getElementById('count-num-' + n).textContent = state.boxCount;
    }

    // 支払チップ
    document.querySelectorAll('.pay-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.pay-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        paymentMethod = chip.dataset.pay;
      });
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function submitOrder() {
      document.getElementById('error-msg').style.display = 'none';

      const customerName  = document.getElementById('customer_name').value.trim();
      const customerPhone = document.getElementById('customer_phone').value.trim();
      const customerEmail = document.getElementById('customer_email').value.trim();
      const senderName    = document.getElementById('sender_name').value.trim();
      const senderPhone   = document.getElementById('sender_phone').value.trim();
      const senderPostal  = document.getElementById('sender_postal_code').value.trim();
      const senderAddress = document.getElementById('sender_address').value.trim();
      const note          = document.getElementById('note').value.trim();

      if (!customerName || !customerPhone || !customerEmail) return showError('申込者情報を入力してください');
      if (!senderName || !senderPhone || !senderPostal || !senderAddress) return showError('送り主情報を入力してください');

      // 届け先を収集
      const blocks = document.querySelectorAll('.address-block');
      if (blocks.length === 0) return showError('届け先を1件以上追加してください');

      const addresses = [];
      for (let i = 0; i < blocks.length; i++) {
        const id = blocks[i].id.replace('address-block-', '');
        const state = addressState[parseInt(id)];
        const name         = document.getElementById('receiver_name_' + id)?.value.trim();
        const phone        = document.getElementById('receiver_phone_' + id)?.value.trim() || '';
        const postal       = document.getElementById('postal_code_' + id)?.value.trim() || '';
        const addr         = document.getElementById('address_' + id)?.value.trim();
        const deliveryDate = document.getElementById('delivery_date_' + id)?.value || '';
        const addrNote     = document.getElementById('addr_note_' + id)?.value.trim() || '';

        if (!name || !addr) return showError(`届け先 ${i + 1} の氏名と住所を入力してください`);
        if (!deliveryDate) return showError(`届け先 ${i + 1} の希望配送日を選択してください`);
        if (state.selectedItems.size === 0) return showError(`届け先 ${i + 1} の品種を1つ以上選んでください`);

        addresses.push({
          index: i + 1,
          receiver_name: name,
          receiver_phone: phone,
          postal_code: postal,
          address: addr,
          delivery_date: deliveryDate,
          box_size: state.boxSize,
          box_count: state.boxCount,
          item_ids: Array.from(state.selectedItems),
          note: addrNote,
        });
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '送信中...';

      try {
        const res = await fetch(`/${storeSlug}/delivery/order/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
          body: JSON.stringify({
            customer_name: customerName,
            customer_phone: customerPhone,
            customer_email: customerEmail,
            sender_name: senderName,
            sender_phone: senderPhone,
            sender_postal_code: senderPostal,
            sender_address: senderAddress,
            payment_method: paymentMethod,
            note,
            addresses,
          }),
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('order-form').style.display = 'none';
          document.getElementById('complete-screen').style.display = 'block';
        } else {
          showError(data.error || '送信に失敗しました');
          btn.disabled = false;
          btn.textContent = '📦 注文を申し込む';
        }
      } catch (e) {
        showError('通信エラーが発生しました。もう一度お試しください。');
        btn.disabled = false;
        btn.textContent = '📦 注文を申し込む';
      }
    }

    // 最初から1件表示
    addAddress();
  </script>
</body>
</html>
