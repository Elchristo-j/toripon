<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご注文 - {{ seat.code }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; color: #f0e6c8; font-family: sans-serif; padding-bottom: 100px; }

    header {
      background: #111;
      border-bottom: 2px solid #c9a84c;
      padding: 16px;
      text-align: center;
    }
    header h1 { color: #c9a84c; font-size: 1.1rem; }
    header p { font-size: 0.85rem; color: #999; margin-top: 4px; }

    .category { margin: 16px 12px 0; }
    .category h2 {
      font-size: 0.9rem;
      color: #c9a84c;
      border-left: 3px solid #c9a84c;
      padding-left: 8px;
      margin-bottom: 10px;
    }

    .item {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-name { font-size: 1rem; }
    .item-price { color: #c9a84c; font-size: 1rem; margin-top: 4px; }

    .qty-control { display: flex; align-items: center; gap: 10px; }
    .qty-btn {
      width: 48px; height: 48px;
      background: #c9a84c; color: #111;
      border: none; border-radius: 50%;
      font-size: 1.4rem; font-weight: bold;
      cursor: pointer;
    }
    .qty-num { font-size: 1.2rem; min-width: 24px; text-align: center; }

    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #c9a84c; color: #111;
      padding: 16px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <h1>頂 ご注文</h1>
  <p>{{ seat.code }} のお客様</p>
</header>

{% for category in categories %}
  {% if category.items.all %}
  <div class="category">
    <h2>{{ category.name }}</h2>
    {% for item in category.items.all %}
      {% if item.is_available %}
      <div class="item">
        <div>
          <div class="item-name">{{ item.name }}</div>
          <div class="item-price">¥{{ item.price }}</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty({{ item.id }}, -1)">−</button>
          <span class="qty-num" id="qty-{{ item.id }}">0</span>
          <button class="qty-btn" onclick="changeQty({{ item.id }}, 1)">＋</button>
        </div>
      </div>
      {% endif %}
    {% endfor %}
  </div>
  {% endif %}
{% endfor %}

<div class="cart-bar" id="cart-bar" onclick="submitOrder()">
  注文する（<span id="cart-count">0</span>品）
</div>

<script>
  const cart = {};
  const orderId = {{ order.id }};

  function changeQty(itemId, delta) {
    if (!cart[itemId]) cart[itemId] = 0;
    cart[itemId] = Math.max(0, cart[itemId] + delta);
    document.getElementById('qty-' + itemId).textContent = cart[itemId];
    updateCartBar();
  }

  function updateCartBar() {
    const total = Object.values(cart).reduce((a, b) => a + b, 0);
    document.getElementById('cart-count').textContent = total;
    document.getElementById('cart-bar').style.display = total > 0 ? 'block' : 'none';
  }

  function submitOrder() {
    const items = Object.entries(cart)
      .filter(([id, qty]) => qty > 0)
      .map(([id, qty]) => ({ menu_item_id: parseInt(id), quantity: qty }));

    fetch("{% url 'orders:submit' %}", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': '{{ csrf_token }}',
      },
      body: JSON.stringify({ order_id: orderId, items: items }),
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        alert('ご注文ありがとうございました！');
        location.reload();
      }
    });
  }
</script>

</body>
</html>
