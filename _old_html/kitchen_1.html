<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とりぽん — 厨房</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1A1A1A;color:#F0F0F0;font-family:'Noto Sans JP',sans-serif;min-height:100vh}
.header{background:#111;border-bottom:3px solid #2EAF7A;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:14px}
.store-name{font-size:18px;font-weight:700;color:#2EAF7A;letter-spacing:.08em}
.page-title{font-size:13px;color:#666;letter-spacing:.1em}
.header-right{display:flex;align-items:center;gap:12px}
.conn-status{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid #333;color:#888}
.conn-status.online{border-color:#2EAF7A;color:#2EAF7A;background:rgba(46,175,122,0.1)}
.conn-status.error{border-color:#E85A5A;color:#E85A5A}
.clock{font-size:13px;color:#888;min-width:52px;text-align:right}
.new-badge-count{background:#E85A5A;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;display:none}
.new-badge-count.show{display:block}
.tabs{display:flex;border-bottom:2px solid #2A2A2A;padding:0 20px}
.tab{padding:12px 20px;font-size:13px;color:#666;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;letter-spacing:.04em}
.tab.active{color:#2EAF7A;border-bottom-color:#2EAF7A;font-weight:500}
.tab:hover:not(.active){color:#aaa}
.main{padding:16px 20px;max-width:1200px;margin:0 auto}
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.order-card{background:#222;border:2px solid #333;border-radius:14px;overflow:hidden;transition:border-color .2s}
.order-card.status-new{border-color:#E85A5A}
.order-card.status-cooking{border-color:#E8A83A}
.order-card.status-done{border-color:#2EAF7A;opacity:.7}
.card-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2A2A2A}
.card-table{font-size:18px;font-weight:700;color:#F0F0F0}
.card-table span{color:#2EAF7A}
.card-time{font-size:11px;color:#666}
.card-timer{font-size:13px;font-weight:700;color:#E85A5A;min-width:40px;text-align:right}
.card-timer.warn{color:#E8A83A}
.card-timer.ok{color:#2EAF7A}
.status-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.06em}
.status-badge.new{background:rgba(232,90,90,0.2);color:#E85A5A;border:1px solid #E85A5A}
.status-badge.cooking{background:rgba(232,168,58,0.2);color:#E8A83A;border:1px solid #E8A83A}
.card-items{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.order-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2A2A2A}
.order-item:last-child{border-bottom:none}
.item-name{font-size:14px;color:#E0E0E0}
.item-qty{font-size:16px;font-weight:700;color:#2EAF7A;min-width:30px;text-align:right}
.card-footer{padding:10px 14px;border-top:1px solid #2A2A2A;display:flex;gap:8px}
.action-btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:opacity .2s}
.action-btn:hover{opacity:.85}
.btn-start{background:#E8A83A;color:#1A1A1A}
.btn-done{background:#2EAF7A;color:#1A1A1A}
.btn-cancel{background:#333;color:#888;font-weight:400}
.card-total{padding:6px 14px 0;font-size:12px;color:#666;text-align:right}
.empty{text-align:center;padding:60px 20px;color:#444}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-text{font-size:15px;line-height:2}
.sound-btn{background:#222;border:1px solid #333;color:#888;font-size:12px;padding:4px 10px;border-radius:20px;cursor:pointer}
.sound-btn.on{border-color:#2EAF7A;color:#2EAF7A}
.history-list{display:flex;flex-direction:column;gap:10px}
.history-item{background:#1E1E1E;border:1px solid #2A2A2A;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.history-table{font-size:15px;font-weight:700;color:#666}
.history-table span{color:#2EAF7A}
.history-items{flex:1;font-size:12px;color:#555;line-height:1.8}
.history-time{font-size:11px;color:#444;white-space:nowrap}
.history-total{font-size:13px;color:#444;white-space:nowrap}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div>
      <div class="store-name">とりぽん</div>
      <div class="page-title">厨房モニター</div>
    </div>
    <div class="new-badge-count" id="newBadge">0件 新規</div>
  </div>
  <div class="header-right">
    <button class="sound-btn on" id="soundBtn" onclick="toggleSound()">🔔 音ON</button>
    <div class="conn-status" id="connStatus">接続中...</div>
    <div class="clock" id="clock"></div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab(this,'active')">対応中</div>
  <div class="tab" onclick="switchTab(this,'done')">完了済み</div>
</div>

<div class="main">
  <div id="activeView">
    <div class="orders-grid" id="ordersGrid">
      <div class="empty">
        <div class="empty-icon">🍳</div>
        <div class="empty-text">注文を待っています<br>お客様が注文すると<br>ここにリアルタイムで表示されます</div>
      </div>
    </div>
  </div>
  <div id="doneView" style="display:none">
    <div class="history-list" id="historyList">
      <div class="empty">
        <div class="empty-icon">✅</div>
        <div class="empty-text">完了した注文はここに表示されます</div>
      </div>
    </div>
  </div>
</div>

<script>
var DB_URL = 'https://toripon-default-rtdb.asia-southeast1.firebasedatabase.app';
var orders      = {};
var prevNewKeys = {};
var soundOn     = true;
var pollTimer   = null;

// ── 時計 ──
function updateClock(){
  var now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0');
}
updateClock();
setInterval(updateClock, 10000);

// ── 音 ──
function toggleSound(){
  soundOn = !soundOn;
  var btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔔 音ON' : '🔕 音OFF';
  btn.classList.toggle('on', soundOn);
}

function playBeep(){
  if(!soundOn) return;
  try{
    var ctx  = new (window.AudioContext || window.webkitAudioContext)();
    var osc  = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  }catch(e){}
}

// ── タブ ──
function switchTab(el, view){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('activeView').style.display = view === 'active' ? '' : 'none';
  document.getElementById('doneView').style.display   = view === 'done'   ? '' : 'none';
}

// ── 経過時間 ──
function elapsed(ts){
  if(!ts) return '';
  var sec = Math.floor((Date.now() - ts) / 1000);
  if(sec < 60) return sec + '秒';
  return Math.floor(sec/60) + '分' + ('0'+(sec%60)).slice(-2) + '秒';
}
function timerClass(ts){
  if(!ts) return '';
  var min = (Date.now() - ts) / 60000;
  if(min < 5)  return 'ok';
  if(min < 10) return 'warn';
  return '';
}

// ── ステータス更新（REST PATCH） ──
function updateStatus(key, status){
  fetch(DB_URL + '/orders/' + key + '.json', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: status })
  }).then(function(){ fetchOrders(); })
    .catch(function(e){ console.error(e); });
}

// ── イベント委譲 ──
document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  updateStatus(btn.getAttribute('data-key'), btn.getAttribute('data-action'));
});

// ── カード生成 ──
function makeCard(key, o){
  var isNew       = o.status === 'new';
  var statusLabel = isNew ? '新規' : '調理中';
  var statusCls   = isNew ? 'new'  : 'cooking';
  var timeStr     = o.createdAt
    ? new Date(o.createdAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})
    : '';
  var itemsHtml = '';
  (o.items || []).forEach(function(item){
    itemsHtml +=
      '<div class="order-item">' +
        '<span class="item-name">' + item.name + '</span>' +
        '<span class="item-qty">x' + item.qty + '</span>' +
      '</div>';
  });
  var actionBtn = isNew
    ? '<button class="action-btn btn-start" data-action="cooking" data-key="' + key + '">調理開始</button>'
    : '<button class="action-btn btn-done"  data-action="done"    data-key="' + key + '">提供完了</button>';

  var div = document.createElement('div');
  div.className = 'order-card status-' + o.status;
  div.id = 'card-' + key;
  div.innerHTML =
    '<div class="card-header">' +
      '<div>' +
        '<div class="card-table">テーブル <span>' + o.table + '</span></div>' +
        '<div class="card-time">' + timeStr + '</div>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:8px">' +
        '<div class="card-timer ' + timerClass(o.createdAt) + '" id="timer-' + key + '">' + elapsed(o.createdAt) + '</div>' +
        '<div class="status-badge ' + statusCls + '">' + statusLabel + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card-items">' + itemsHtml + '</div>' +
    '<div class="card-total">合計 ¥' + (o.total || 0).toLocaleString() + '</div>' +
    '<div class="card-footer">' + actionBtn +
      '<button class="action-btn btn-cancel" data-action="cancelled" data-key="' + key + '">取消</button>' +
    '</div>';
  return div;
}

// ── 描画 ──
function renderOrders(){
  var entries = Object.entries(orders);
  var active  = entries.filter(function(e){ return e[1].status==='new'||e[1].status==='cooking'; })
                       .sort(function(a,b){ return (a[1].createdAt||0)-(b[1].createdAt||0); });
  var done    = entries.filter(function(e){ return e[1].status==='done'; })
                       .sort(function(a,b){ return (b[1].createdAt||0)-(a[1].createdAt||0); });

  var newCount = entries.filter(function(e){ return e[1].status==='new'; }).length;
  var badge = document.getElementById('newBadge');
  badge.textContent = newCount + '件 新規';
  badge.classList.toggle('show', newCount > 0);

  var grid = document.getElementById('ordersGrid');
  grid.innerHTML = '';
  if(!active.length){
    grid.innerHTML = '<div class="empty"><div class="empty-icon">🍳</div>' +
      '<div class="empty-text">注文を待っています<br>お客様が注文するとここに表示されます</div></div>';
  } else {
    active.forEach(function(e){ grid.appendChild(makeCard(e[0], e[1])); });
  }

  var hist = document.getElementById('historyList');
  hist.innerHTML = '';
  if(!done.length){
    hist.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>' +
      '<div class="empty-text">完了した注文はここに表示されます</div></div>';
  } else {
    done.forEach(function(e){
      var o = e[1];
      var row = document.createElement('div');
      row.className = 'history-item';
      row.innerHTML =
        '<div class="history-table">T<span>' + o.table + '</span></div>' +
        '<div class="history-items">' + (o.items||[]).map(function(i){ return i.name+'x'+i.qty; }).join('　') + '</div>' +
        '<div class="history-total">¥' + (o.total||0).toLocaleString() + '</div>' +
        '<div class="history-time">' + (o.createdAt ? new Date(o.createdAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}) : '') + '</div>';
      hist.appendChild(row);
    });
  }
}

// ── ポーリング（REST GET, 3秒ごと） ──
function fetchOrders(){
  fetch(DB_URL + '/orders.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      var newData = data || {};

      // 新規注文検出
      Object.keys(newData).forEach(function(k){
        if(newData[k].status === 'new' && !prevNewKeys[k]) playBeep();
      });
      prevNewKeys = {};
      Object.keys(newData).forEach(function(k){
        if(newData[k].status === 'new') prevNewKeys[k] = true;
      });

      orders = newData;
      renderOrders();

      document.getElementById('connStatus').textContent = '接続中';
      document.getElementById('connStatus').className   = 'conn-status online';
    })
    .catch(function(){
      document.getElementById('connStatus').textContent = '接続エラー';
      document.getElementById('connStatus').className   = 'conn-status error';
    });
}

// タイマー毎秒
setInterval(function(){
  Object.entries(orders).forEach(function(e){
    var key = e[0]; var o = e[1];
    if(o.status==='new'||o.status==='cooking'){
      var el = document.getElementById('timer-'+key);
      if(el){ el.textContent = elapsed(o.createdAt); el.className = 'card-timer '+timerClass(o.createdAt); }
    }
  });
}, 1000);

// 初回 + 3秒ポーリング
fetchOrders();
setInterval(fetchOrders, 3000);
</script>
</body>
</html>
